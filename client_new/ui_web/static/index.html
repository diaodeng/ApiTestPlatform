<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QTRClient</title>
  <link rel="icon" href="../assets/favicon.ico" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    // 后端事件入口：EventBus（Python）通过 evaluate_js 调用 __qtrDispatch。
    // 事件先入队，待前端 app.js 装配好分发器后再消费，避免早期事件丢失。
    (function () {
      window.__qtrEventQueue = [];
      window.__qtrHandler = null;
      window.__qtrDispatch = function (eventName, payload) {
        if (window.__qtrHandler) {
          try {
            window.__qtrHandler(eventName, payload || {});
          } catch (e) {
            console.error("事件分发异常", eventName, e);
          }
          return;
        }
        window.__qtrEventQueue.push([eventName, payload || {}]);
      };

      // 前端运行时错误上报：等待 pywebview api 就绪后写后端日志，便于排查页面问题。
      function reportError(kind, message, source, lineno) {
        var send = function () {
          try {
            window.pywebview.api.app.log_js_error(kind, String(message), String(source || ""), Number(lineno || 0));
          } catch (e) { /* 上报失败不再递归 */ }
        };
        var waited = 0;
        (function wait() {
          if (window.pywebview && window.pywebview.api) return send();
          if ((waited += 100) > 10000) return;
          setTimeout(wait, 100);
        })();
      }
      window.addEventListener("error", function (e) {
        reportError("js_error", e.message, e.filename, e.lineno);
      });
      window.addEventListener("unhandledrejection", function (e) {
        reportError("js_rejection", e.reason && e.reason.message ? e.reason.message : String(e.reason), "", 0);
      });
    })();
  </script>
</head>
<body>
  <div id="app">
    <header id="header-bar">
      <div class="app-title">QTRClient</div>
      <div class="header-spacer"></div>
      <span id="header-version" class="muted small"></span>
      <button id="btn-plugins" class="btn ghost">插件</button>
      <div class="theme-select-wrap">
        <select id="theme-select" class="select" title="主题模式">
          <option value="auto">主题: 自动</option>
          <option value="light">主题: 浅色</option>
          <option value="dark">主题: 深色</option>
        </select>
      </div>
    </header>

    <div id="content">
      <nav id="nav-frame"><ul id="nav-list"></ul></nav>
      <main id="page-container"></main>
    </div>

    <footer id="status-bar">就绪</footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/core.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
