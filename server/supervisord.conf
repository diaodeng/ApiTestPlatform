[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log

; =========================
; FastAPI（通过 app.py 启动）
; =========================
[program:fastapi]
command=/app/.venv/bin/python app.py
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

; =========================
; Celery Beat (RedBeat)
; =========================
; [program:redbeat]
; command=celery -A worker.celery_app beat -l info
; directory=/app
; autostart=true
; autorestart=true
; startsecs=5
; stopsignal=TERM
; stopwaitsecs=20
; priority=20
