[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log

; =========================
; FastAPI（通过 app.py 启动）
; =========================
[program:fastapi]
command=/app/.venv/bin/python app.py --env=%(ENV_APP_ENV)s
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",APP_ENV="%(ENV_APP_ENV)s"

; =========================
; Celery Beat
; =========================
[program:celery-beat]
command=/app/.venv/bin/celery -A config.celery_app.celery_app beat -l info --scheduler config.celery_scheduler:DatabaseScheduler
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",APP_ENV="%(ENV_APP_ENV)s"

[program:celery-worker]
command=/app/.venv/bin/celery -A config.celery_app.celery_app worker -l info -Q sys,qtr,celery --pool=threads --concurrency=4
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",APP_ENV="%(ENV_APP_ENV)s"

[program:celery-worker-process]
command=/app/.venv/bin/celery -A config.celery_app.celery_app worker -l info -Q sys_process,qtr_process --pool=prefork --concurrency=1 --max-tasks-per-child=20
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
priority=31
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",APP_ENV="%(ENV_APP_ENV)s"
