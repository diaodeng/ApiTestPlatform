[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log

; =========================
; FastAPI（通过 app.py 启动）
; =========================
[program:fastapi]
command=/app/.venv/bin/python app.py --env=prod
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

; =========================
; Celery Beat
; =========================
[program:celery-beat]
command=/app/.venv/bin/celery -A config.celery_app.celery_app beat -l info --scheduler config.celery_scheduler:DatabaseScheduler
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:celery-worker]
command=/app/.venv/bin/celery -A config.celery_app.celery_app worker -l info -Q sys,qtr,celery --concurrency=4
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
